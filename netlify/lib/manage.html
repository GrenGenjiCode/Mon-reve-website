<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Booked dates · Mon Rêve</title>
<link rel="icon" href="/images/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#FBF8F2;--linen:#E8DECC;--teak:#9A6A3E;--sepia:#6E5139;--ink:#2A211A;--body:#4A3E34;--muted:#85776A;--line:rgba(110,81,57,.18);--red:#A2402E;--ease:cubic-bezier(.23,1,.32,1);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
body{background:var(--paper);color:var(--ink);font:300 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
header{padding:32px 0 22px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
header img{width:56px;height:56px;border-radius:50%}
header h1{font:300 clamp(30px,4.5vw,42px)/1.05 var(--serif)}
.howto{font:italic 400 22px/1.35 var(--serif);color:var(--sepia);margin-bottom:6px}
.tip{font-size:14px;color:var(--muted);margin-bottom:26px}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:30px 34px}
.month h2{font:400 25px/1 var(--serif);margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.wd{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:6px}
.d{height:44px;font-size:16px}
.d span{display:grid;place-items:center;width:40px;height:40px;margin:0 auto;border-radius:50%;transition:background .3s var(--ease),color .3s,transform .25s var(--ease)}
.d:hover span{background:var(--linen)}
.d:active span{transform:scale(.9)}
.d.past{color:#CDBFB0;pointer-events:none}
.d.on span{background:var(--teak);color:var(--paper)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,248,242,.97);border-top:1px solid var(--line);box-shadow:0 -10px 30px -20px rgba(42,33,26,.4)}
.bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
.state{flex:1;min-width:160px;font:italic 400 20px var(--serif);color:var(--sepia)}
.bar input{width:150px;font:400 18px var(--sans);letter-spacing:.3em;padding:13px 14px;border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink)}
.bar input:focus{outline:0;border-color:var(--teak);box-shadow:0 0 0 3px rgba(154,106,62,.15)}
.save{font:400 14px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:17px 30px;border-radius:999px;background:var(--ink);color:var(--paper);transition:background .3s,opacity .3s,scale .16s var(--ease)}
.save:hover{background:var(--teak)}
.save:active{scale:.97}
.save:disabled{opacity:.35;pointer-events:none}
.msg{width:100%;font-size:15px;display:none}
.msg.show{display:block;animation:in .3s var(--ease)}
.msg.ok{color:#3F6B3A}.msg.bad{color:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-width:520px){.state{flex-basis:100%;font-size:18px}.bar input{flex:1;width:auto;min-width:0}.save{padding:15px 24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="/images/emblem.png" alt=""><h1>Mon Rêve · Booked dates</h1></header>
  <p class="howto">Tap the days that are booked, enter the PIN and press Save. Tap a booked day again to free it.</p>
  <p class="tip">Tip: guests can still check in on a guest's check-out day. For a stay from 10 to 13 Oct, tap 10, 11 and 12.</p>
  <div class="months" id="months"></div>
</div>

<div class="bar">
  <div class="wrap">
    <p class="state" id="state">Loading…</p>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
    <button class="save" id="save" disabled>Save</button>
    <p class="msg" id="msg" role="status"></p>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = new URLSearchParams(location.search).get('k') || '';
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const AHEAD = 18;                                   // same range guests can pick on the website
  const pad = n => String(n).padStart(2, '0');
  const ymd = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);
  const nice = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  // "today" on India time, worked out each time the page opens, so the calendar always moves on by itself
  const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());

  let saved = new Set(), now = new Set();            // saved on the website / what's shown now
  const changes = () => [...now].filter(d => !saved.has(d)).length + [...saved].filter(d => !now.has(d)).length;

  function build() {
    const [ty, tm] = today.split('-').map(Number);
    let html = '';
    for (let i = 0; i < AHEAD; i++) {
      const t = new Date(Date.UTC(ty, tm - 1 + i, 1)), y = t.getUTCFullYear(), m = t.getUTCMonth();
      const days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
      html += '<section class="month"><h2>' + MONTHS[m] + ' ' + y + '</h2><div class="grid">' +
        ['Su','Mo','Tu','We','Th','Fr','Sa'].map(w => '<span class="wd">' + w + '</span>').join('') +
        '<span></span>'.repeat(t.getUTCDay());
      for (let d = 1; d <= days; d++) {
        const v = ymd(y, m, d), past = v < today;
        html += '<button type="button" class="d' + (past ? ' past' : '') + '" data-d="' + v + '"' + (past ? ' disabled' : '') +
          ' aria-label="' + nice(v) + '"><span>' + d + '</span></button>';
      }
      html += '</div></section>';
    }
    $('months').innerHTML = html;
  }

  function paint() {
    document.querySelectorAll('.d').forEach(b => {
      const on = now.has(b.dataset.d);
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    const n = changes();
    $('state').textContent = n ? n + ' change' + (n > 1 ? 's' : '') + ' not saved yet' : 'Everything is saved';
    $('save').disabled = !n;
  }

  $('months').addEventListener('click', e => {
    const b = e.target.closest('.d'); if (!b || b.disabled) return;
    const v = b.dataset.d;
    now.has(v) ? now.delete(v) : now.add(v);
    $('msg').className = 'msg';
    paint();
  });

  const say = (t, ok) => { const m = $('msg'); m.textContent = t; m.className = 'msg show ' + (ok ? 'ok' : 'bad'); };

  async function load() {
    try {
      const r = await fetch('/api/availability', { cache: 'no-store' });
      const d = await r.json();
      saved = new Set(d.nights || []); now = new Set(saved);
    } catch (e) { say('Could not load the booked dates. Check your internet connection and reload the page.', false); }
    paint();
  }

  $('save').addEventListener('click', async () => {
    const pin = $('pin').value.trim();
    if (!pin) { $('pin').focus(); return say('Enter the PIN, then press Save.', false); }
    $('save').disabled = true; $('save').textContent = 'Saving…';
    try {
      const r = await fetch('/api/availability', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: KEY, pin, add: [...now].filter(d => !saved.has(d)), remove: [...saved].filter(d => !now.has(d)) })
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { saved = new Set(d.nights || []); now = new Set(saved); say('Saved. The website is updated.', true); }
      else if (d.error === 'wrong-pin') say('Wrong PIN. ' + d.left + ' tr' + (d.left === 1 ? 'y' : 'ies') + ' left.', false);
      else if (d.error === 'locked') say('Too many wrong PINs. Please wait ' + d.minutes + ' minutes and try again.', false);
      else if (d.error === 'not-configured') say('The PIN has not been set up on Netlify yet.', false);
      else say('Could not save. Please try again.', false);
    } catch (e) { say('Could not save. Check your internet connection and try again.', false); }
    $('save').textContent = 'Save'; paint();
  });
  $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('save').click(); });
  addEventListener('beforeunload', e => { if (changes()) { e.preventDefault(); e.returnValue = ''; } });

  build(); paint(); load();
})();
</script>
</body>
</html>
